<html>
  <body>
    <style>
.cute-card{
  max-width:380px;
  margin:14px auto;
  padding:8px;
  border-radius:24px;
  background:linear-gradient(145deg,#ffdce6,#e8ddff,#d9f2ff);
  background-size:250% 250%;
  animation:cuteBg 8s ease infinite;
  font-family:Arial,'Noto Sans Thai',sans-serif;
  box-shadow:0 12px 30px rgba(88,75,112,.17);
}

.cute-inner{
  background:rgba(255,255,255,.82);
  border-radius:18px;
  padding:15px;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(8px);
}

.cute-bubble{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  animation:cuteBubble 5s ease-in-out infinite;
}

.cb1{width:34px;height:34px;top:-10px;right:35px;}
.cb2{width:18px;height:18px;top:38px;right:12px;animation-delay:1.1s;}
.cb3{width:24px;height:24px;bottom:30px;left:-7px;animation-delay:2.2s;}

.cute-top{
  display:flex;
  align-items:center;
  gap:11px;
  position:relative;
  z-index:2;
}

.cute-avatar{
  width:58px;
  height:58px;
  min-width:58px;
  border-radius:20px;
  background:linear-gradient(145deg,#ffe2ea,#c9bbef);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
  transform:rotate(-3deg);
  animation:cuteAvatar 3.4s ease-in-out infinite;
  box-shadow:0 6px 14px rgba(101,88,133,.14);
}

.cute-name{
  font-size:23px;
  font-weight:900;
  color:#554665;
}

.cute-online{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:4px;
  padding:3px 7px;
  border-radius:20px;
  background:#ecfaef;
  color:#608369;
  font-size:8px;
}

.cute-green{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#76b587;
  animation:cuteOnline 1.8s infinite;
}

.cute-tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:13px;
}

.cute-tag{
  padding:5px 8px;
  border-radius:15px;
  background:#f6edf9;
  color:#6b5676;
  font-size:9px;
  border:1px solid #ece0f1;
}

.cute-message{
  margin-top:13px;
  background:#fff;
  padding:10px 12px;
  border-radius:4px 14px 14px 14px;
  font-size:10px;
  line-height:1.7;
  color:#5f5268;
  box-shadow:0 4px 12px rgba(76,61,92,.07);
  animation:cuteMessage 4s ease-in-out infinite;
}

.cute-stat{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-top:12px;
}

.cute-box{
  text-align:center;
  padding:8px 4px;
  background:rgba(248,243,251,.85);
  border-radius:11px;
}

.cute-number{
  font-size:13px;
  font-weight:bold;
  color:#785d88;
}

.cute-label{
  font-size:7px;
  color:#a08ea9;
  margin-top:2px;
}

.cute-footer{
  margin-top:12px;
  padding:9px;
  border-radius:20px;
  background:linear-gradient(120deg,#d8c4ef,#f4bfd1);
  color:#fff;
  text-align:center;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
  box-shadow:0 6px 14px rgba(120,93,136,.13);
  animation:cuteButton 3s ease-in-out infinite;
}

@keyframes cuteBg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes cuteBubble{
  0%,100%{transform:translateY(0);opacity:.5}
  50%{transform:translateY(-8px);opacity:.9}
}

@keyframes cuteAvatar{
  0%,100%{transform:rotate(-3deg) translateY(0)}
  50%{transform:rotate(2deg) translateY(-3px)}
}

@keyframes cuteOnline{
  0%,100%{opacity:.4}
  50%{opacity:1}
}

@keyframes cuteMessage{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}

@keyframes cuteButton{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.015)}
}
</style>

<div class="cute-card">
  <div class="cute-inner">

    <div class="cute-bubble cb1"></div>
    <div class="cute-bubble cb2"></div>
    <div class="cute-bubble cb3"></div>

    <div class="cute-top">

      <div class="cute-avatar">
        T
      </div>

      <div>
        <div class="cute-name">
          ธาม ♡
        </div>

        <div style="font-size:9px;color:#9a859f;margin-top:2px;">
          @tham · chemistry lecturer
        </div>

        <div class="cute-online">
          <span class="cute-green"></span>
          online
        </div>
      </div>

    </div>

    <div class="cute-tags">
      <span class="cute-tag">🐶 puppy type</span>
      <span class="cute-tag">♡ ขี้อ้อน</span>
      <span class="cute-tag">☁ ขี้งอน</span>
    </div>

    <div class="cute-message">
      “วันนี้เหนื่อยจัง...
      <br>
      ขออ้อนเธอแป๊บนึงได้ไหม?”
    </div>

    <div class="cute-stat">

      <div class="cute-box">
        <div class="cute-number">99</div>
        <div class="cute-label">ความอ้อน</div>
      </div>

      <div class="cute-box">
        <div class="cute-number">??</div>
        <div class="cute-label">ความหึง</div>
      </div>

      <div class="cute-box">
        <div class="cute-number">∞</div>
        <div class="cute-label">ความอ่อย</div>
      </div>

    </div>

    <div class="cute-footer">
      ♡ TALK TO THAM
    </div>

  </div>
</div>
  </body>
</html>
