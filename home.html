/* Render Preview */

const preview = document.getElementById("thamPreview");
const code = document.getElementById("thamCode");

preview.innerHTML = thamTemplate;
code.value = thamTemplate;


/* PREVIEW TAB */

function showThamPreview(){

  preview.style.display = "block";
  code.style.display = "none";

  document.getElementById("copyBtn").style.display = "none";

  document.getElementById("previewBtn").style.background = "#fff";
  document.getElementById("previewBtn").style.color = "#111";

  document.getElementById("codeBtn").style.background = "#1f2937";
  document.getElementById("codeBtn").style.color = "#94a3b8";

}


/* CODE TAB */

function showThamCode(){

  preview.style.display = "none";
  code.style.display = "block";

  document.getElementById("copyBtn").style.display = "block";

  document.getElementById("codeBtn").style.background = "#fff";
  document.getElementById("codeBtn").style.color = "#111";

  document.getElementById("previewBtn").style.background = "#1f2937";
  document.getElementById("previewBtn").style.color = "#94a3b8";

}


/* COPY */

async function copyThamCode(){

  const button = document.getElementById("copyBtn");

  try {

    await navigator.clipboard.writeText(thamTemplate);

    button.innerText = "COPIED ✓";

    setTimeout(() => {
      button.innerText = "COPY CODE";
    },1500);

  } catch(e){

    code.select();

    document.execCommand("copy");

    button.innerText = "COPIED ✓";

    setTimeout(() => {
      button.innerText = "COPY CODE";
    },1500);

  }

}

</script>
